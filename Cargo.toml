[workspace]
resolver = "2"
members = [
    "shared",
    "server",
    "client",
    "bots/rust-reference",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["mpdairy <mpdairy@gmail.com>"]
repository = "https://github.com/mpdairy/xpilot.io"

[workspace.dependencies]
shared = { path = "shared" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
libm = "0.2"

# Server-only
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.11"
bytes = "1"
async-trait = "0.1"

# Client-only (wasm)
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"

[workspace.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "DomTokenList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlButtonElement",
    "Node",
    "CanvasRenderingContext2d",
    "EventTarget",
    "KeyboardEvent",
    "Performance",
    "WebSocket",
    "MessageEvent",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "Location",
    "TextMetrics",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "s"
